
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Buckeye Vault | Ohio State Football</title>
<style>
:root {
  --red: #bb0000;
  --red-light: #ed1c24;
  --bg: #101010;
  --panel: #191919;
  --panel2: #202020;
  --text: #f7f7f7;
  --muted: #aaa;
  --border: #333;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
header {
  background: rgba(12,12,12,.97);
  border-bottom: 1px solid #303030;
  position: sticky;
  top: 0;
  z-index: 10;
}
.nav {
  max-width: 1250px;
  margin: auto;
  min-height: 76px;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 1.2px;
}
.logo {
  width: 43px;
  height: 43px;
  background: var(--red);
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 25px;
  box-shadow: 0 0 25px #bb000044;
}
.brand small {
  display: block;
  font-size: 10px;
  letter-spacing: 3px;
  color: #bbb;
  margin-top: 4px;
}
nav { display: flex; gap: 8px; flex-wrap: wrap; }
.nav-btn {
  border: 0;
  color: #ccc;
  background: transparent;
  padding: 11px 14px;
  border-radius: 6px;
  font-weight: 700;
}
.nav-btn:hover, .nav-btn.active { color: white; background: var(--red); }
main { min-height: 75vh; }
.wrap { max-width: 1190px; margin: auto; padding: 35px 24px 70px; }
.hero {
  position: relative;
  overflow: hidden;
  min-height: 350px;
  border-radius: 15px;
  padding: 55px;
  display: flex;
  align-items: center;
  background:
    radial-gradient(ellipse at 85% 20%, #bb000077, transparent 42%),
    linear-gradient(110deg, #202020, #101010 70%);
  border: 1px solid #343434;
}
.hero::after {
  content: "O";
  position: absolute;
  right: 8%;
  top: -90px;
  color: #bb000019;
  font-family: Georgia, serif;
  font-size: 440px;
  font-weight: bold;
  pointer-events: none;
}
.hero-content { position: relative; z-index: 1; max-width: 690px; }
.eyebrow {
  display: inline-block;
  color: #ff6b6b;
  font-size: 12px;
  letter-spacing: 3px;
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 15px;
}
h1 { font-size: clamp(38px, 6vw, 68px); line-height: .98; margin: 0 0 20px; letter-spacing: -2px; }
h1 span { color: var(--red-light); }
.hero p { color: #c2c2c2; font-size: 17px; line-height: 1.7; max-width: 560px; }
.primary, .secondary, .danger {
  border: 0;
  border-radius: 6px;
  padding: 12px 17px;
  font-weight: 800;
}
.primary { color: white; background: var(--red); }
.primary:hover { background: #e00000; }
.secondary { background: #303030; color: white; border: 1px solid #454545; }
.danger { background: #6d1717; color: white; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 25px; }
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 15px;
  margin: 42px 0 20px;
}
.section-head h2, .page-title { margin: 0; font-size: 28px; }
.section-head p { margin: 7px 0 0; color: var(--muted); }
.section-head button { white-space: nowrap; }
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.card {
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: transform .18s, border-color .18s;
}
.card:hover { transform: translateY(-3px); border-color: #6e2525; }
.card-art {
  height: 155px;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 70% 20%, #bb000055, transparent 45%),
    linear-gradient(135deg, #282828, #141414);
  border-bottom: 1px solid #333;
  color: #e2e2e2;
  font-size: 50px;
  font-weight: 900;
}
.card-body { padding: 18px; }
.tag {
  display: inline-block;
  color: #ff7777;
  background: #bb000022;
  border: 1px solid #bb000044;
  border-radius: 4px;
  padding: 5px 8px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.card h3 { margin: 12px 0 8px; font-size: 19px; }
.card p { color: #aaa; font-size: 14px; line-height: 1.55; }
.card-meta { color: #ddd; font-size: 13px; margin-top: 14px; }
.card-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.card-actions button, .card-actions a { font-size: 12px; text-decoration: none; }
.page-title { font-size: 36px; margin-bottom: 9px; }
.page-intro { color: var(--muted); margin: 0 0 28px; line-height: 1.6; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0 30px; }
.filters input, .filters select {
  background: #1b1b1b;
  border: 1px solid #414141;
  color: white;
  border-radius: 6px;
  padding: 11px 12px;
  min-width: 150px;
}
.season-heading {
  border-left: 4px solid var(--red);
  padding-left: 14px;
  margin: 34px 0 17px;
  font-size: 23px;
}
.empty {
  padding: 45px 20px;
  text-align: center;
  border: 1px dashed #444;
  border-radius: 10px;
  color: #aaa;
}
.admin-box {
  max-width: 850px;
  margin: 15px auto;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 25px;
  border-radius: 10px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.field { display: flex; flex-direction: column; gap: 7px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 800; color: #ddd; }
.field input, .field textarea, .field select {
  width: 100%;
  border: 1px solid #414141;
  background: #111;
  color: white;
  border-radius: 6px;
  padding: 12px;
}
.field textarea { min-height: 90px; resize: vertical; }
.admin-section { border-top: 1px solid #383838; margin-top: 26px; padding-top: 24px; }
.admin-section h3 { margin-top: 0; }
.admin-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid #333;
}
.admin-entry p { color: #aaa; margin: 5px 0 0; font-size: 13px; }
.notice { padding: 12px 14px; border-radius: 6px; margin: 15px 0; background: #242424; color: #ddd; }
.notice.error { background: #481919; color: #ffd5d5; }
.notice.success { background: #18321f; color: #c9ffd5; }
footer {
  border-top: 1px solid #303030;
  padding: 30px 24px;
  text-align: center;
  color: #888;
  font-size: 12px;
  line-height: 1.8;
}
footer strong { color: #ddd; }
.hidden { display: none !important; }
@media (max-width: 850px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { padding: 35px 28px; }
  .nav { align-items: flex-start; flex-direction: column; }
}
@media (max-width: 560px) {
  .grid { grid-template-columns: 1fr; }
  .wrap { padding: 24px 15px 50px; }
  .hero { padding: 30px 22px; min-height: 310px; }
  .hero::after { right: -50px; font-size: 320px; }
  .form-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
  .section-head { align-items: flex-start; flex-direction: column; }
  .brand { font-size: 16px; }
}
</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="brand">
      <div class="logo">O</div>
      <div>BUCKEYE VAULT<small>OHIO STATE FOOTBALL</small></div>
    </div>
    <nav aria-label="Main navigation">
      <button class="nav-btn active" data-page="home">Home</button>
      <button class="nav-btn" data-page="games">Games</button>
      <button class="nav-btn" data-page="highlights">Highlights</button>
      <button class="nav-btn" data-page="admin">Admin</button>
    </nav>
  </div>
</header>

<main id="app">
  <div class="wrap"><div class="empty">Loading Buckeye Vault…</div></div>
</main>

<footer>
  <strong>BUCKEYE VAULT</strong><br>
  An independent fan project for organizing Ohio State football games and highlight links.<br>
  Not affiliated with The Ohio State University. Video content belongs to its respective owners.
</footer>

<script>
const app = document.getElementById("app");
let content = { games: [], highlights: [] };
let isAdmin = false;
let currentPage = "home";
let notice = "";
let noticeType = "success";

const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

function safeVideoUrl(value) {
  try {
    const u = new URL(value);
    if (u.protocol !== "https:") return "";
    if (!["youtube.com", "www.youtube.com", "youtu.be", "www.youtube-nocookie.com", "vimeo.com", "www.vimeo.com", "player.vimeo.com"].includes(u.hostname)) return "";
    return u.href;
  } catch { return ""; }
}

function videoLink(url, label = "Watch video") {
  const safe = safeVideoUrl(url);
  return safe ? `<a class="primary" style="display:inline-block;padding:9px 12px" href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>` : "";
}

function emptyState(message) {
  return `<div class="empty">${esc(message)}</div>`;
}

function gameCard(game) {
  return `<article class="card">
    <div class="card-art">🏈</div>
    <div class="card-body">
      <span class="tag">${esc(game.season || "Season unknown")}</span>
      <h3>Ohio State vs. ${esc(game.opponent || "Opponent TBD")}</h3>
      <p>${esc(game.description || "Ohio State football game")}</p>
      <div class="card-meta">${esc(game.date || "Date TBD")} ${game.score ? " · " + esc(game.score) : ""}</div>
      ${game.result ? `<div class="card-meta">${esc(game.result)}</div>` : ""}
      <div class="card-actions">${videoLink(game.videoUrl)}</div>
    </div>
  </article>`;
}

function highlightCard(item) {
  return `<article class="card">
    <div class="card-art">▶</div>
    <div class="card-body">
      <span class="tag">${esc(item.season || "Ohio State")}</span>
      <h3>${esc(item.title || "Untitled highlight")}</h3>
      <p>${esc(item.description || "Ohio State football highlight")}</p>
      <div class="card-actions">${videoLink(item.videoUrl, "Watch highlight")}</div>
    </div>
  </article>`;
}

function groupGames(games) {
  const groups = {};
  games.forEach(g => {
    const season = g.season || "Season unknown";
    (groups[season] ||= []).push(g);
  });
  return Object.keys(groups).sort((a,b) => b.localeCompare(a, undefined, { numeric: true }))
    .map(season => `<h2 class="season-heading">${esc(season)} Season</h2>
      <div class="grid">${groups[season].map(gameCard).join("")}</div>`).join("");
}

function showNotice() {
  return notice ? `<div class="notice ${esc(noticeType)}" role="status">${esc(notice)}</div>` : "";
}

function homePage() {
  const recentGames = [...content.games].slice(0, 3);
  const recentHighlights = [...content.highlights].slice(0, 3);
  return `<div class="wrap">
    <section class="hero">
      <div class="hero-content">
        <span class="eyebrow">Scarlet and Gray • Game Day Archive</span>
        <h1>THE HOME OF<br><span>BUCKEYE</span> FOOTBALL.</h1>
        <p>Your vault for Ohio State football games, season archives, and highlight links. Explore the games and moments that make Saturdays special.</p>
        <div class="hero-actions">
          <button class="primary" data-go="games">Explore Games →</button>
          <button class="secondary" data-go="highlights">Watch Highlights</button>
        </div>
      </div>
    </section>
    <div class="section-head">
      <div><h2>Game Archive</h2><p>Browse games organized by season.</p></div>
      <button class="secondary" data-go="games">All Games →</button>
    </div>
    ${recentGames.length ? `<div class="grid">${recentGames.map(gameCard).join("")}</div>` : emptyState("No games have been added yet.")}
    <div class="section-head">
      <div><h2>Featured Highlights</h2><p>Find highlight links in one place.</p></div>
      <button class="secondary" data-go="highlights">All Highlights →</button>
    </div>
    ${recentHighlights.length ? `<div class="grid">${recentHighlights.map(highlightCard).join("")}</div>` : emptyState("No highlights have been added yet.")}
  </div>`;
}

function gamesPage() {
  return `<div class="wrap">
    <h1 class="page-title">Game Archive</h1>
    <p class="page-intro">Explore Ohio State football games, grouped by season.</p>
    <div class="filters">
      <input id="gameSearch" placeholder="Search opponent or game…" aria-label="Search games">
      <select id="seasonFilter" aria-label="Filter by season">
        <option value="">All seasons</option>
        ${[...new Set(content.games.map(g => g.season).filter(Boolean))]
          .sort((a,b) => b.localeCompare(a, undefined, {numeric:true}))
          .map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("")}
      </select>
    </div>
    <div id="gamesList">${groupGames(content.games)}</div>
  </div>`;
}

function highlightsPage() {
  return `<div class="wrap">
    <h1 class="page-title">Highlights</h1>
    <p class="page-intro">Big plays, memorable moments, and highlight videos from Ohio State football.</p>
    <div class="filters">
      <input id="highlightSearch" placeholder="Search highlights…" aria-label="Search highlights">
      <select id="highlightSeason" aria-label="Filter highlights by season">
        <option value="">All seasons</option>
        ${[...new Set(content.highlights.map(h => h.season).filter(Boolean))]
          .sort((a,b) => b.localeCompare(a, undefined, {numeric:true}))
          .map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("")}
      </select>
    </div>
    <div id="highlightsList" class="grid">${content.highlights.map(highlightCard).join("") || emptyState("No highlights have been added yet.")}</div>
  </div>`;
}

function loginPage() {
  return `<div class="wrap">
    <div class="admin-box">
      <span class="eyebrow">Restricted area</span>
      <h1 class="page-title">Admin Login</h1>
      <p class="page-intro">Sign in to manage the game archive and highlights.</p>
      ${showNotice()}
      <form id="loginForm">
        <div class="field">
          <label for="adminPassword">Admin password</label>
          <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div style="margin-top:16px"><button class="primary" type="submit">Sign In</button></div>
      </form>
    </div>
  </div>`;
}

function adminPage() {
  if (!isAdmin) return loginPage();
  return `<div class="wrap">
    <span class="eyebrow">Vault management</span>
    <h1 class="page-title">Admin Dashboard</h1>
    <p class="page-intro">Add and remove games and highlight links. Changes are saved on the server.</p>
    ${showNotice()}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px">
      <button class="secondary" id="logoutButton">Sign Out</button>
    </div>

    <div class="admin-box">
      <h2>Add a Game</h2>
      <form id="gameForm" class="form-grid">
        <div class="field"><label for="gameSeason">Season (e.g. 2025)</label><input id="gameSeason" required maxlength="20" placeholder="2025"></div>
        <div class="field"><label for="gameOpponent">Opponent</label><input id="gameOpponent" required maxlength="100" placeholder="Michigan"></div>
        <div class="field"><label for="gameDate">Date</label><input id="gameDate" type="date"></div>
        <div class="field"><label for="gameScore">Score</label><input id="gameScore" maxlength="40" placeholder="27–17"></div>
        <div class="field"><label for="gameResult">Result / event</label><input id="gameResult" maxlength="100" placeholder="Win, Loss, Bowl Game…"></div>
        <div class="field"><label for="gameVideo">YouTube or Vimeo URL</label><input id="gameVideo" type="url" placeholder="https://www.youtube.com/..."></div>
        <div class="field full"><label for="gameDescription">Description</label><textarea id="gameDescription" maxlength="1000" placeholder="Short game description"></textarea></div>
        <div class="field full"><button class="primary" type="submit">Add Game</button></div>
      </form>
      <div class="admin-section">
        <h3>Existing Games (${content.games.length})</h3>
        <div id="adminGames">${content.games.map((g,i) => `<div class="admin-entry"><div><strong>${esc(g.season)} · Ohio State vs. ${esc(g.opponent)}</strong><p>${esc(g.date)} ${esc(g.score)}</p></div><button class="danger" data-delete-game="${esc(g.id)}">Remove</button></div>`).join("") || emptyState("No games yet.")}</div>
      </div>
    </div>

    <div class="admin-box">
      <h2>Add a Highlight</h2>
      <form id="highlightForm" class="form-grid">
        <div class="field"><label for="highlightTitle">Highlight title</label><input id="highlightTitle" required maxlength="150" placeholder="Game-winning touchdown"></div>
        <div class="field"><label for="highlightSeasonInput">Season</label><input id="highlightSeasonInput" maxlength="20" placeholder="2025"></div>
        <div class="field full"><label for="highlightVideo">YouTube or Vimeo URL</label><input id="highlightVideo" type="url" required placeholder="https://www.youtube.com/..."></div>
        <div class="field full"><label for="highlightDescription">Description</label><textarea id="highlightDescription" maxlength="1000" placeholder="Describe the highlight"></textarea></div>
        <div class="field full"><button class="primary" type="submit">Add Highlight</button></div>
      </form>
      <div class="admin-section">
        <h3>Existing Highlights (${content.highlights.length})</h3>
        <div id="adminHighlights">${content.highlights.map(h => `<div class="admin-entry"><div><strong>${esc(h.title)}</strong><p>${esc(h.season)} · ${esc(h.description)}</p></div><button class="danger" data-delete-highlight="${esc(h.id)}">Remove</button></div>`).join("") || emptyState("No highlights yet.")}</div>
      </div>
    </div>
  </div>`;
}

function render() {
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === currentPage);
  });
  if (currentPage === "games") app.innerHTML = gamesPage();
  else if (currentPage === "highlights") app.innerHTML = highlightsPage();
  else if (currentPage === "admin") app.innerHTML = adminPage();
  else app.innerHTML = homePage();
}

function setNotice(message, type = "success") {
  notice = message;
  noticeType = type;
}

async function refreshContent() {
  const response = await fetch("/api/content", { cache: "no-store" });
  if (!response.ok) throw new Error("Could not load the archive.");
  content = await response.json();
}

async function saveContent() {
  const response = await fetch("/api/content", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(content)
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(result.error || "Could not save changes.");
}

function filterGames() {
  const q = document.getElementById("gameSearch")?.value.toLowerCase() || "";
  const season = document.getElementById("seasonFilter")?.value || "";
  const filtered = content.games.filter(g =>
    (!season || g.season === season) &&
    [g.opponent, g.description, g.result, g.score, g.season].join(" ").toLowerCase().includes(q)
  );
  const list = document.getElementById("gamesList");
  if (list) list.innerHTML = filtered.length ? groupGames(filtered) : emptyState("No matching games found.");
}

function filterHighlights() {
  const q = document.getElementById("highlightSearch")?.value.toLowerCase() || "";
  const season = document.getElementById("highlightSeason")?.value || "";
  const filtered = content.highlights.filter(h =>
    (!season || h.season === season) &&
    [h.title, h.description, h.season].join(" ").toLowerCase().includes(q)
  );
  const list = document.getElementById("highlightsList");
  if (list) list.innerHTML = filtered.length ? filtered.map(highlightCard).join("") : emptyState("No matching highlights found.");
}

document.addEventListener("click", async event => {
  const nav = event.target.closest("[data-page]");
  if (nav) {
    currentPage = nav.dataset.page;
    setNotice("");
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  const go = event.target.closest("[data-go]");
  if (go) {
    currentPage = go.dataset.go;
    setNotice("");
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  const deleteGame = event.target.closest("[data-delete-game]");
  const deleteHighlight = event.target.closest("[data-delete-highlight]");

  if (deleteGame) {
    if (!confirm("Remove this game from the archive?")) return;
    content.games = content.games.filter(g => g.id !== deleteGame.dataset.deleteGame);
    try {
      await saveContent();
      setNotice("Game removed.");
      render();
    } catch (err) {
      setNotice(err.message, "error");
      render();
    }
  }

  if (deleteHighlight) {
    if (!confirm("Remove this highlight?")) return;
    content.highlights = content.highlights.filter(h => h.id !== deleteHighlight.dataset.deleteHighlight);
    try {
      await saveContent();
      setNotice("Highlight removed.");
      render();
    } catch (err) {
      setNotice(err.message, "error");
      render();
    }
  }

  if (event.target.closest("#logoutButton")) {
    await fetch("/api/logout", { method: "POST" });
    isAdmin = false;
    setNotice("You have signed out.");
    render();
  }
});

document.addEventListener("input", event => {
  if (event.target.id === "gameSearch" || event.target.id === "seasonFilter") filterGames();
  if (event.target.id === "highlightSearch" || event.target.id === "highlightSeason") filterHighlights();
});

document.addEventListener("change", event => {
  if (event.target.id === "seasonFilter") filterGames();
  if (event.target.id === "highlightSeason") filterHighlights();
});

document.addEventListener("submit", async event => {
  if (event.target.id === "loginForm") {
    event.preventDefault();
    const password = document.getElementById("adminPassword").value;
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password })
    });
    if (response.ok) {
      isAdmin = true;
      setNotice("Welcome to the dashboard.");
    } else {
      const result = await response.json().catch(() => ({}));
      setNotice(result.error || "Login failed.", "error");
    }
    render();
  }

  if (event.target.id === "gameForm") {
    event.preventDefault();
    const game = {
      id: crypto.randomUUID(),
      season: document.getElementById("gameSeason").value.trim(),
      opponent: document.getElementById("gameOpponent").value.trim(),
      date: document.getElementById("gameDate").value,
      score: document.getElementById("gameScore").value.trim(),
      result: document.getElementById("gameResult").value.trim(),
      description: document.getElementById("gameDescription").value.trim(),
      videoUrl: document.getElementById("gameVideo").value.trim()
    };
    if (!game.season || !game.opponent) {
      setNotice("Season and opponent are required.", "error");
      render();
      return;
    }
    if (game.videoUrl && !safeVideoUrl(game.videoUrl)) {
      setNotice("Use an HTTPS YouTube or Vimeo URL.", "error");
      render();
      return;
    }
    content.games.push(game);
    try {
      await saveContent();
      setNotice("Game added successfully.");
      render();
    } catch (err) {
      content.games = content.games.filter(g => g.id !== game.id);
      setNotice(err.message, "error");
      render();
    }
  }

  if (event.target.id === "highlightForm") {
    event.preventDefault();
    const item = {
      id: crypto.randomUUID(),
      title: document.getElementById("highlightTitle").value.trim(),
      season: document.getElementById("highlightSeasonInput").value.trim(),
      videoUrl: document.getElementById("highlightVideo").value.trim(),
      description: document.getElementById("highlightDescription").value.trim()
    };
    if (!item.title || !safeVideoUrl(item.videoUrl)) {
      setNotice("Enter a title and a valid HTTPS YouTube or Vimeo URL.", "error");
      render();
      return;
    }
    content.highlights.push(item);
    try {
      await saveContent();
      setNotice("Highlight added successfully.");
      render();
    } catch (err) {
      content.highlights = content.highlights.filter(h => h.id !== item.id);
      setNotice(err.message, "error");
      render();
    }
  }
});

async function start() {
  try {
    await refreshContent();
    const response = await fetch("/api/session");
    const state = await response.json();
    isAdmin = Boolean(state.isAdmin);
    render();
  } catch (err) {
    app.innerHTML = `<div class="wrap">${emptyState("Could not connect to the server. Please refresh the page.")}</div>`;
  }
}
start();
</script>
</body>
</html>
