
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b0000">
<title>Buckeye Vault | Ohio State Football</title>
<style>
:root {
  --scarlet: #bb0000;
  --scarlet-dark: #790000;
  --bg: #101010;
  --panel: #1a1a1a;
  --panel2: #222;
  --text: #f7f7f7;
  --muted: #aaa;
  --border: #333;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
header {
  background: linear-gradient(120deg, #790000, #bd0000);
  border-bottom: 3px solid #e5b64b;
}
.header-inner {
  max-width: 1200px;
  margin: auto;
  padding: 23px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo {
  width: 58px;
  height: 58px;
  border: 3px solid white;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 25px;
  background: white;
  color: var(--scarlet);
}
.brand h1 { margin: 0; font-size: 28px; }
.brand p { margin: 5px 0 0; color: #ffe1e1; font-size: 13px; }
nav { display: flex; gap: 8px; flex-wrap: wrap; }
nav button {
  border: 1px solid #ffffff50;
  background: #ffffff12;
  color: white;
  padding: 11px 14px;
  border-radius: 7px;
  font-weight: bold;
}
nav button:hover, nav button.active { background: white; color: var(--scarlet-dark); }
main { max-width: 1200px; margin: auto; padding: 25px 20px 55px; }
.hero {
  min-height: 240px;
  padding: 36px;
  border-radius: 14px;
  background:
    linear-gradient(90deg, #240000ed, #8b0000a8),
    repeating-linear-gradient(45deg, #ffffff08 0 2px, transparent 2px 12px);
  border: 1px solid #8b2929;
  display: flex;
  align-items: center;
  margin-bottom: 32px;
}
.hero h2 { font-size: clamp(30px, 5vw, 50px); margin: 0 0 12px; }
.hero p { color: #eee; line-height: 1.6; max-width: 600px; }
.eyebrow {
  color: #ffd15c;
  text-transform: uppercase;
  letter-spacing: 2px;
  font-size: 12px;
  font-weight: bold;
}
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  margin: 30px 0 17px;
}
.section-heading h2 { margin: 0; font-size: 25px; }
.section-heading p { color: var(--muted); margin: 6px 0 0; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr));
  gap: 20px;
}
.card {
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.card-body { padding: 18px; }
.card h3 { margin: 0 0 10px; font-size: 20px; overflow-wrap: anywhere; }
.card p { color: #ccc; line-height: 1.55; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; margin-bottom: 13px; }
.tag {
  display: inline-block;
  background: #4b0000;
  border: 1px solid #8d3030;
  border-radius: 5px;
  padding: 5px 8px;
  color: #ffdada;
  font-size: 12px;
  margin: 0 5px 8px 0;
}
.video-player {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  overflow: hidden;
}
.video-player iframe, .video-player video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.video-placeholder {
  width: 100%;
  aspect-ratio: 16 / 9;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 20px;
  background: linear-gradient(135deg, #300000, #151515);
  color: white;
}
.play-icon { font-size: 43px; color: #ffcbcb; }
.btn {
  display: inline-block;
  padding: 11px 15px;
  border: 0;
  border-radius: 7px;
  background: var(--scarlet);
  color: white;
  font-weight: bold;
  text-decoration: none;
}
.btn:hover { background: #e00000; }
.btn.secondary { background: #333; border: 1px solid #555; }
.btn.danger { background: #742222; }
.btn.small { padding: 8px 10px; font-size: 13px; }
.searchbar {
  width: 100%;
  max-width: 390px;
  padding: 12px;
  background: #191919;
  color: white;
  border: 1px solid #444;
  border-radius: 7px;
}
.empty {
  padding: 35px 20px;
  text-align: center;
  color: var(--muted);
  background: var(--panel);
  border: 1px dashed #444;
  border-radius: 10px;
  grid-column: 1 / -1;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 20px;
}
.panel h2, .panel h3 { margin-top: 0; }
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; color: #ddd; font-weight: bold; }
.field input, .field textarea, .field select {
  width: 100%;
  padding: 12px;
  border: 1px solid #444;
  background: #101010;
  color: white;
  border-radius: 7px;
}
.field textarea { min-height: 85px; resize: vertical; }
.form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.notice {
  padding: 12px;
  border-radius: 7px;
  margin: 12px 0;
  background: #222;
  border: 1px solid #444;
  color: #ddd;
  overflow-wrap: anywhere;
}
.notice.error { border-color: #a33; color: #ffbaba; }
.notice.success { border-color: #387e45; color: #b6f5c2; }
.admin-list { display: flex; flex-direction: column; gap: 10px; }
.admin-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
  background: #111;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #333;
}
.admin-item strong { overflow-wrap: anywhere; }
footer {
  padding: 25px 20px;
  text-align: center;
  color: #999;
  border-top: 1px solid #292929;
  font-size: 13px;
}
.hidden { display: none !important; }
.loading { text-align: center; padding: 45px 15px; color: #bbb; }
@media (max-width: 600px) {
  .header-inner { padding: 18px 14px; }
  .brand h1 { font-size: 22px; }
  .logo { width: 47px; height: 47px; font-size: 20px; }
  nav { width: 100%; }
  nav button { flex: 1; padding: 10px 7px; font-size: 12px; }
  main { padding: 18px 13px 35px; }
  .hero { padding: 24px 19px; min-height: 200px; }
  .form-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="logo">OSU</div>
      <div>
        <h1>BUCKEYE VAULT</h1>
        <p>Ohio State Football • Games • Highlights</p>
      </div>
    </div>
    <nav aria-label="Main navigation">
      <button class="active" data-page="home">Home</button>
      <button data-page="games">Games</button>
      <button data-page="highlights">Highlights</button>
      <button data-page="admin">Admin</button>
    </nav>
  </div>
</header>

<main>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="app"><div class="loading">Loading Buckeye Vault…</div></div>
</main>

<footer>
  Buckeye Vault • An independent fan project. Not affiliated with or endorsed by The Ohio State University.
</footer>

<script>
"use strict";

const app = document.getElementById("app");
const statusBox = document.getElementById("status");

let content = { games: [], highlights: [] };
let isAdmin = false;
let currentPage = "home";
let searchTerm = "";
let loading = true;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function showStatus(message, type = "") {
  statusBox.innerHTML = message
    ? `<div class="notice ${type}">${escapeHTML(message)}</div>`
    : "";
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    credentials: "same-origin",
    ...options,
    headers: {
      ...(options.body ? { "Content-Type": "application/json" } : {}),
      ...(options.headers || {})
    }
  });

  const text = await response.text();
  let data = {};

  try {
    data = text ? JSON.parse(text) : {};
  } catch {
    data = { message: text };
  }

  if (!response.ok) {
    throw new Error(data.error || data.message || `Request failed (${response.status})`);
  }

  return data;
}

async function loadContent() {
  loading = true;

  try {
    const data = await api("/api/content");
    content = {
      games: Array.isArray(data.games) ? data.games : [],
      highlights: Array.isArray(data.highlights) ? data.highlights : []
    };
  } catch (error) {
    showStatus("Couldn't load the saved content: " + error.message, "error");
  }

  try {
    const session = await api("/api/session");
    isAdmin = Boolean(session.isAdmin);
  } catch {
    isAdmin = false;
  }

  loading = false;
  render();
}

async function saveContent() {
  showStatus("Saving changes…");

  try {
    const data = await api("/api/content", {
      method: "PUT",
      body: JSON.stringify(content)
    });

    if (Array.isArray(data.games)) content.games = data.games;
    if (Array.isArray(data.highlights)) content.highlights = data.highlights;

    showStatus("Changes saved successfully!", "success");
    render();
  } catch (error) {
    showStatus("Couldn't save changes: " + error.message, "error");
  }
}

/*
  Supported playback:
  - YouTube watch links, youtu.be links, Shorts and embed links
  - Vimeo links
  - Direct HTTPS MP4, WebM and Ogg video files

  YouTube/Vimeo links are converted to embed URLs instead of ordinary links.
*/
function getVideoInfo(rawURL) {
  if (!rawURL || typeof rawURL !== "string") return null;

  try {
    const url = new URL(rawURL.trim());

    if (url.protocol !== "https:") return null;

    const host = url.hostname.toLowerCase();
    const path = url.pathname;
    let id = "";

    if (["youtube.com", "www.youtube.com", "m.youtube.com",
         "youtube-nocookie.com", "www.youtube-nocookie.com"].includes(host)) {
      id = url.searchParams.get("v") ||
        path.match(/^\/(?:embed|shorts|live)\/([^/?]+)/)?.[1] || "";

      if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) return null;

      return {
        type: "iframe",
        src: "https://www.youtube-nocookie.com/embed/" + id
      };
    }

    if (host === "youtu.be" || host === "www.youtu.be") {
      id = path.split("/").filter(Boolean)[0] || "";

      if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) return null;

      return {
        type: "iframe",
        src: "https://www.youtube-nocookie.com/embed/" + id
      };
    }

    if (["vimeo.com", "www.vimeo.com", "player.vimeo.com"].includes(host)) {
      const match = path.match(/\/(?:video\/)?(\d+)/);

      if (!match) return null;

      return {
        type: "iframe",
        src: "https://player.vimeo.com/video/" + match[1]
      };
    }

    if (/\.(mp4|webm|ogg)$/i.test(path)) {
      return { type: "video", src: url.href };
    }

    return { type: "external", src: url.href };
  } catch {
    return null;
  }
}

function videoPlayer(rawURL, title) {
  const info = getVideoInfo(rawURL);

  if (!info) {
    return `
      <div class="video-placeholder">
        <div>
          <div class="play-icon">▶</div>
          <p>No playable video added yet.</p>
        </div>
      </div>`;
  }

  if (info.type === "iframe") {
    return `
      <div class="video-player">
        <iframe
          src="${escapeHTML(info.src)}"
          title="${escapeHTML(title || "Ohio State football video")}"
          loading="lazy"
          allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>`;
  }

  if (info.type === "video") {
    return `
      <div class="video-player">
        <video controls preload="metadata" playsinline>
          <source src="${escapeHTML(info.src)}">
          Your browser does not support HTML video.
        </video>
      </div>`;
  }

  return `
    <div class="video-placeholder">
      <div>
        <div class="play-icon">▶</div>
        <p>This link cannot be embedded automatically.</p>
        <a class="btn" href="${escapeHTML(info.src)}"
           target="_blank" rel="noopener noreferrer">Open video source</a>
      </div>
    </div>`;
}

function getTitle(item, fallback) {
  return item.title || item.name || item.opponent || fallback;
}

function getVideoURL(item) {
  return item.videoUrl || item.videoURL || item.video || item.url || "";
}

function formatDate(value) {
  if (!value) return "";
  const date = new Date(value + (String(value).length === 10 ? "T12:00:00" : ""));
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleDateString(undefined, {
    year: "numeric", month: "short", day: "numeric"
  });
}

function gameCard(game, index) {
  const title = getTitle(game, "Ohio State Game");
  const opponent = game.opponent || "";
  const date = formatDate(game.date);
  const score = game.score || "";
  const description = game.description || game.summary || "";

  return `
    <article class="card">
      ${videoPlayer(getVideoURL(game), title)}
      <div class="card-body">
        <span class="tag">FOOTBALL GAME</span>
        ${game.season ? `<span class="tag">${escapeHTML(game.season)}</span>` : ""}
        <h3>${escapeHTML(title)}</h3>
        <div class="meta">
          ${date ? escapeHTML(date) : ""}
          ${date && opponent ? " • " : ""}
          ${opponent ? "vs. " + escapeHTML(opponent) : ""}
        </div>
        ${score ? `<p><strong>Score:</strong> ${escapeHTML(score)}</p>` : ""}
        ${description ? `<p>${escapeHTML(description)}</p>` : ""}
        ${isAdmin ? `<button class="btn danger small" data-delete="game" data-index="${index}">Remove game</button>` : ""}
      </div>
    </article>`;
}

function highlightCard(highlight, index) {
  const title = getTitle(highlight, "Ohio State Highlight");
  const description = highlight.description || highlight.summary || "";
  const date = formatDate(highlight.date);

  return `
    <article class="card">
      ${videoPlayer(getVideoURL(highlight), title)}
      <div class="card-body">
        <span class="tag">HIGHLIGHT</span>
        <h3>${escapeHTML(title)}</h3>
        ${date ? `<div class="meta">${escapeHTML(date)}</div>` : ""}
        ${description ? `<p>${escapeHTML(description)}</p>` : ""}
        ${isAdmin ? `<button class="btn danger small" data-delete="highlight" data-index="${index}">Remove highlight</button>` : ""}
      </div>
    </article>`;
}

function filterItems(items) {
  if (!searchTerm) return items;

  return items.filter(item => {
    const searchable = [
      item.title, item.name, item.opponent, item.description,
      item.summary, item.season, item.date, item.score
    ].join(" ").toLowerCase();

    return searchable.includes(searchTerm.toLowerCase());
  });
}

function renderHome() {
  const games = filterItems(content.games);
  const highlights = filterItems(content.highlights);

  return `
    <section class="hero">
      <div>
        <div class="eyebrow">The home of Buckeye football</div>
        <h2>OHIO STATE.<br>ALL THE ACTION.</h2>
        <p>Explore Buckeye games and relive the biggest moments. Watch available videos right here on Buckeye Vault.</p>
        <button class="btn" data-go="games">Explore Games</button>
        <button class="btn secondary" data-go="highlights">Watch Highlights</button>
      </div>
    </section>

    <div class="section-heading">
      <div><h2>Latest Games</h2><p>Games from the Buckeye Vault collection</p></div>
      <button class="btn secondary" data-go="games">View all games →</button>
    </div>
    <div class="grid">
      ${games.length
        ? games.slice(0, 3).map(gameCard).join("")
        : `<div class="empty">No games have been added yet.</div>`}
    </div>

    <div class="section-heading">
      <div><h2>Featured Highlights</h2><p>Big plays and unforgettable moments</p></div>
      <button class="btn secondary" data-go="highlights">View all highlights →</button>
    </div>
    <div class="grid">
      ${highlights.length
        ? highlights.slice(0, 3).map(highlightCard).join("")
        : `<div class="empty">No highlights have been added yet.</div>`}
    </div>`;
}

function renderGames() {
  const games = filterItems(content.games);

  return `
    <div class="section-heading">
      <div><h2>Ohio State Games</h2><p>Browse games and watch available footage.</p></div>
      <input class="searchbar" id="search" placeholder="Search games…" value="${escapeHTML(searchTerm)}">
    </div>
    <div class="grid">
      ${games.length
        ? games.map(game => gameCard(game, content.games.indexOf(game))).join("")
        : `<div class="empty">No matching games found.</div>`}
    </div>`;
}

function renderHighlights() {
  const highlights = filterItems(content.highlights);

  return `
    <div class="section-heading">
      <div><h2>Football Highlights</h2><p>Watch the best Buckeye moments.</p></div>
      <input class="searchbar" id="search" placeholder="Search highlights…" value="${escapeHTML(searchTerm)}">
    </div>
    <div class="grid">
      ${highlights.length
        ? highlights.map(item => highlightCard(item, content.highlights.indexOf(item))).join("")
        : `<div class="empty">No matching highlights found.</div>`}
    </div>`;
}

function renderAdmin() {
  if (!isAdmin) {
    return `
      <section class="panel" style="max-width:480px;margin:30px auto">
        <h2>Admin Login</h2>
        <p>Sign in to manage games and highlights.</p>
        <form id="login-form">
          <div class="field">
            <label for="admin-password">Admin password</label>
            <input id="admin-password" type="password" autocomplete="current-password" required>
          </div>
          <div class="form-actions">
            <button class="btn" type="submit">Sign In</button>
          </div>
          <div id="login-error" role="alert"></div>
        </form>
      </section>`;
  }

  return `
    <div class="section-heading">
      <div><h2>Admin Dashboard</h2><p>Add games, add highlights, and manage your collection.</p></div>
      <button class="btn secondary" id="logout-button">Log Out</button>
    </div>

    <section class="panel">
      <h3>Add a Game</h3>
      <form id="game-form">
        <div class="form-grid">
          <div class="field">
            <label for="game-title">Game title *</label>
            <input id="game-title" required placeholder="Ohio State vs. Michigan">
          </div>
          <div class="field">
            <label for="game-opponent">Opponent</label>
            <input id="game-opponent" placeholder="Michigan">
          </div>
          <div class="field">
            <label for="game-date">Game date</label>
            <input id="game-date" type="date">
          </div>
          <div class="field">
            <label for="game-season">Season</label>
            <input id="game-season" placeholder="2026">
          </div>
          <div class="field">
            <label for="game-score">Final score</label>
            <input id="game-score" placeholder="Ohio State 31 - 20 Michigan">
          </div>
          <div class="field">
            <label for="game-video">Video URL</label>
            <input id="game-video" type="url" placeholder="https://www.youtube.com/watch?v=..." >
          </div>
          <div class="field full">
            <label for="game-description">Description</label>
            <textarea id="game-description" placeholder="Game recap or notes…"></textarea>
          </div>
        </div>
        <div class="form-actions"><button class="btn" type="submit">Add Game</button></div>
      </form>
    </section>

    <section class="panel">
      <h3>Add a Highlight</h3>
      <form id="highlight-form">
        <div class="form-grid">
          <div class="field">
            <label for="highlight-title">Highlight title *</label>
            <input id="highlight-title" required placeholder="Amazing touchdown">
          </div>
          <div class="field">
            <label for="highlight-date">Date</label>
            <input id="highlight-date" type="date">
          </div>
          <div class="field full">
            <label for="highlight-video">Video URL *</label>
            <input id="highlight-video" type="url" required placeholder="https://www.youtube.com/watch?v=...">
          </div>
          <div class="field full">
            <label for="highlight-description">Description</label>
            <textarea id="highlight-description" placeholder="Describe the play…"></textarea>
          </div>
        </div>
        <div class="form-actions"><button class="btn" type="submit">Add Highlight</button></div>
      </form>
    </section>

    <section class="panel">
      <h3>Manage Games (${content.games.length})</h3>
      <div class="admin-list">
        ${content.games.length ? content.games.map((game, index) => `
          <div class="admin-item">
            <div><strong>${escapeHTML(getTitle(game, "Ohio State Game"))}</strong>
              <div class="meta">${escapeHTML(formatDate(game.date))}</div></div>
            <button class="btn danger small" data-delete="game" data-index="${index}">Remove</button>
          </div>`).join("") : `<p>No games added yet.</p>`}
      </div>
    </section>

    <section class="panel">
      <h3>Manage Highlights (${content.highlights.length})</h3>
      <div class="admin-list">
        ${content.highlights.length ? content.highlights.map((item, index) => `
          <div class="admin-item">
            <div><strong>${escapeHTML(getTitle(item, "Highlight"))}</strong>
              <div class="meta">${escapeHTML(formatDate(item.date))}</div></div>
            <button class="btn danger small" data-delete="highlight" data-index="${index}">Remove</button>
          </div>`).join("") : `<p>No highlights added yet.</p>`}
      </div>
    </section>`;
}

function render() {
  document.querySelectorAll("nav button").forEach(button => {
    button.classList.toggle("active", button.dataset.page === currentPage);
  });

  if (loading) {
    app.innerHTML = `<div class="loading">Loading Buckeye Vault…</div>`;
    return;
  }

  if (currentPage === "home") app.innerHTML = renderHome();
  else if (currentPage === "games") app.innerHTML = renderGames();
  else if (currentPage === "highlights") app.innerHTML = renderHighlights();
  else if (currentPage === "admin") app.innerHTML = renderAdmin();

  bindPageEvents();
}

function bindPageEvents() {
  document.querySelectorAll("[data-go]").forEach(button => {
    button.addEventListener("click", () => navigate(button.dataset.go));
  });

  const search = document.getElementById("search");
  if (search) {
    search.addEventListener("input", event => {
      const position = event.target.selectionStart;
      searchTerm = event.target.value;
      render();
      const updated = document.getElementById("search");
      updated?.focus();
      updated?.setSelectionRange(position, position);
    });
  }

  document.querySelectorAll("[data-delete]").forEach(button => {
    button.addEventListener("click", async () => {
      if (!isAdmin) return;

      const type = button.dataset.delete;
      const index = Number(button.dataset.index);
      const array = type === "game" ? content.games : content.highlights;
      const item = array[index];

      if (!item || !confirm(`Remove "${getTitle(item, type)}"?`)) return;

      array.splice(index, 1);
      await saveContent();
    });
  });

  const loginForm = document.getElementById("login-form");
  if (loginForm) {
    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      const password = document.getElementById("admin-password").value;
      const errorBox = document.getElementById("login-error");
      errorBox.innerHTML = "";

      try {
        await api("/api/login", {
          method: "POST",
          body: JSON.stringify({ password })
        });

        isAdmin = true;
        showStatus("Signed in successfully.", "success");
        render();
      } catch (error) {
        errorBox.innerHTML = `<div class="notice error">${escapeHTML(error.message || "Login failed.")}</div>`;
      }
    });
  }

  const logoutButton = document.getElementById("logout-button");
  if (logoutButton) {
    logoutButton.addEventListener("click", async () => {
      try {
        await api("/api/logout", { method: "POST" });
        isAdmin = false;
        showStatus("You have been logged out.", "success");
        render();
      } catch (error) {
        showStatus("Logout failed: " + error.message, "error");
      }
    });
  }

  const gameForm = document.getElementById("game-form");
  if (gameForm) {
    gameForm.addEventListener("submit", async event => {
      event.preventDefault();
      if (!isAdmin) return;

      const videoUrl = document.getElementById("game-video").value.trim();
      if (videoUrl && !getVideoInfo(videoUrl)) {
        showStatus("Enter a valid HTTPS YouTube, Vimeo, or direct MP4/WebM/Ogg video URL.", "error");
        return;
      }

      const title = document.getElementById("game-title").value.trim();
      const opponent = document.getElementById("game-opponent").value.trim();
      const date = document.getElementById("game-date").value;
      const season = document.getElementById("game-season").value.trim();
      const score = document.getElementById("game-score").value.trim();
      const description = document.getElementById("game-description").value.trim();

      content.games.unshift({
        id: makeId(),
        title,
        opponent,
        date,
        season,
        score,
        description,
        videoUrl
      });

      await saveContent();
    });
  }

  const highlightForm = document.getElementById("highlight-form");
  if (highlightForm) {
    highlightForm.addEventListener("submit", async event => {
      event.preventDefault();
      if (!isAdmin) return;

      const title = document.getElementById("highlight-title").value.trim();
      const videoUrl = document.getElementById("highlight-video").value.trim();
      const date = document.getElementById("highlight-date").value;
      const description = document.getElementById("highlight-description").value.trim();

      if (!getVideoInfo(videoUrl)) {
        showStatus("Enter a valid HTTPS YouTube, Vimeo, or direct MP4/WebM/Ogg video URL.", "error");
        return;
      }

      content.highlights.unshift({
        id: makeId(),
        title,
        videoUrl,
        date,
        description
      });

      await saveContent();
    });
  }
}

function makeId() {
  return window.crypto?.randomUUID?.() ||
    Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function navigate(page) {
  currentPage = page;
  searchTerm = "";
  showStatus("");
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", () => navigate(button.dataset.page));
});

loadContent();
</script>
</body>
</html>
